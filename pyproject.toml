[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfu-tracker"
version = "0.1.0"
description = "Lightweight Model FLOPs Utilization and Bandwidth Utilization tracker for PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
hf = [
    "transformers>=4.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mfu_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
